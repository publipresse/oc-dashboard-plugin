<?= $this->styles() ?>
<div class="pp-dash">
    <?php if (isset($error)): ?>
        <p class="pp-dash-error"><?= e($error) ?></p>
    <?php else: ?>
        <?php $statusTone = $isDown ? 'pp-dash-tone--maintenance' : 'pp-dash-tone--online' ?>
        <div class="pp-dash-header">
            <span class="pp-dash-badge <?= $statusTone ?>"><i class="ph ph-power"></i></span>
            <div class="pp-dash-text">
                <span class="pp-dash-eyebrow">Statut du site</span>
                <p class="pp-dash-headline">
                    <?= $isDown ? 'En maintenance' : 'En ligne' ?>
                    <span class="pp-dash-pulse <?= $statusTone ?>" aria-hidden="true"></span>
                </p>
                <ul class="pp-dash-meta">
                    <li>
                        <a href="<?= e($siteUrl) ?>" target="_blank" rel="noopener noreferrer">
                            <?= e($siteHost) ?> <?= $this->icon('external') ?>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <?php if ($score !== null || $launchDate): ?>
            <ul class="pp-dash-facts">
                <?php if ($score !== null): ?>
                    <li class="pp-dash-fact">
                        <?= $ring ?>
                        <div class="pp-dash-fact__text">
                            <span class="pp-dash-fact__label">Audit SEO</span>
                            <span class="pp-dash-fact__value"><?= e($scoreLabel) ?></span>
                            <span class="pp-dash-fact__meta">Score SE Ranking : <?= e($scoreText) ?>/100</span>
                        </div>
                    </li>
                <?php endif ?>
                <?php if ($launchDate): ?>
                    <li class="pp-dash-fact">
                        <span class="pp-dash-fact__icon pp-dash-tone--launch"><i class="ph ph-calendar-check"></i></span>
                        <div class="pp-dash-fact__text">
                            <span class="pp-dash-fact__label"><?= $isLaunched ? 'Mise en ligne' : 'Mise en ligne prévue' ?></span>
                            <span class="pp-dash-fact__value"><?= e($launchDate) ?></span>
                            <span class="pp-dash-fact__meta"><?= e($launchAge) ?></span>
                        </div>
                    </li>
                <?php endif ?>
            </ul>
        <?php endif ?>

        <div class="pp-dash-footer">
            <?php if ($reportUrl): ?>
                <a href="<?= e($reportUrl) ?>" target="_blank" rel="noopener noreferrer">Consulter le rapport SEO</a>
            <?php endif ?>
            <a href="<?= e($maintenanceSettingsUrl) ?>">
                <?= $isDown ? 'Remettre le site en ligne' : 'Mettre en maintenance' ?>
            </a>
        </div>
    <?php endif ?>
</div>
