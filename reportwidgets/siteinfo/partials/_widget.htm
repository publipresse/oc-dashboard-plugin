<?= $this->styles() ?>
<div class="pp-dash">
    <?php if (isset($error)): ?>
        <p class="pp-dash-error"><?= e($error) ?></p>
    <?php elseif (!$managerName && !count($domains)): ?>
        <div class="pp-dash-placeholder">
            <span class="pp-dash-badge pp-dash-badge--site"><?= $this->badgeIcon('ph ph-globe-hemisphere-west') ?></span>
            <p class="pp-dash-empty">Aucune information renseignée. Configurez le module pour les ajouter.</p>
        </div>
    <?php else: ?>
        <div class="pp-dash-header">
            <span class="pp-dash-badge pp-dash-badge--site"><?= $this->badgeIcon('ph ph-globe-hemisphere-west') ?></span>
            <div class="pp-dash-text">
                <span class="pp-dash-eyebrow"><?= e($this->widgetTitle()) ?></span>
                <p class="pp-dash-headline"><?= e($managerName ?: 'Non renseigné') ?></p>
                <?php if ($managerCompany): ?>
                    <ul class="pp-dash-detail-lines">
                        <li><?= $this->icon('building') ?> <?= e($managerCompany) ?></li>
                    </ul>
                <?php endif ?>
            </div>
        </div>

        <?php if (count($domains)): ?>
            <div class="pp-dash-body">
                <p class="pp-dash-section-title">Domaines achetés</p>
                <ul class="pp-dash-domains">
                    <?php foreach ($domains as $domain): ?>
                        <li><?= e($domain) ?></li>
                    <?php endforeach ?>
                </ul>
            </div>
        <?php endif ?>

        <?php if ($managerPhone || $managerEmail): ?>
            <div class="pp-dash-footer">
                <?php if ($managerEmail): ?>
                    <a href="mailto:<?= e($managerEmail) ?>"><?= $this->icon('email') ?> <?= e($managerEmail) ?></a>
                <?php endif ?>
                <?php if ($managerPhone): ?>
                    <a href="tel:<?= e(preg_replace('/[^0-9+]/', '', $managerPhone)) ?>"><?= $this->icon('phone') ?> <?= e($managerPhone) ?></a>
                <?php endif ?>
            </div>
        <?php endif ?>
    <?php endif ?>
</div>
