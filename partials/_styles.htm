<style>
/* Our widgets should always line up to the same height when sharing a row, regardless of
   whether the dashboard row's own "Étirer les widgets" option has been turned on, so we force
   the row's flex items to stretch whenever at least one Publipresse widget sits in it. */
.oc-dashboard .report-row:has(.pp-dash) .row-widgets { align-items: stretch; }

/* Propagates that definite height down to our widget root so it can stretch to match its row
   siblings. No-op otherwise, since percentage heights resolve to auto against an auto-height
   ancestor. */
.oc-dashboard .widget-size-container { height: 100%; }
.oc-dashboard .dashboard-report-widget-static { height: 100%; }
.oc-dashboard .dashboard-report-widget-static .static-body {
    height: 100%;
    display: flex;
    flex-direction: column;
}
.oc-dashboard .dashboard-report-widget-static .static-body > [data-request-data] {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
}
/* Our own header already shows the icon + title, so the native title above it would be a duplicate */
.oc-dashboard .static-body:has(> [data-request-data] .pp-dash) > h3.widget-title {
    display: none;
}

.pp-dash {
    font-size: 14px;
    line-height: 1.5;
    color: var(--bs-body-color);
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    width: 100%;
}
.pp-dash p { margin: 0 0 .5rem; }
.pp-dash a { word-break: break-word; color: var(--bs-link-color, var(--bs-primary, #2196f3)); text-decoration: none; }
.pp-dash a:hover { text-decoration: underline; }
.pp-dash-error { color: #e05353; margin: 0; }
.pp-dash-empty { opacity: .65; font-style: italic; margin: 0; }
.pp-dash-section-title {
    margin: 1rem 0 .4rem;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    opacity: .6;
}

.pp-dash-icon { width: 100%; height: 100%; }

/* Card layout: icon + headline in the header, free content in the body, a bleeding footer bar for links/actions */
.pp-dash-header { display: flex; align-items: flex-start; gap: .85rem; }
.pp-dash-text { min-width: 0; }
.pp-dash-eyebrow {
    display: block;
    font-size: 14px;
    color: var(--bs-secondary-color);
    font-weight: normal;
    margin: 0 0 .1rem;
}
/* Scoped to .pp-dash-text (rather than .pp-dash-headline alone) so this margin reliably wins
   over the generic ".pp-dash p" rule regardless of whether the headline is a <p> or, when it
   doubles as a mailto/tel link (e.g. Support technique), an <a> — which .pp-dash p never
   matches, so relying on it left the <a> variant with no bottom margin at all. */
.pp-dash-text .pp-dash-headline {
    display: block;
    font-size: 24px;
    font-weight: normal;
    margin: 0 0 .35rem;
    color: var(--bs-body-color);
    line-height: 1.25;
    overflow-wrap: anywhere;
}
/* A headline can double as a mailto/tel link (e.g. Support technique); keep it looking like
   plain text rather than a blue link, with an underline only on hover as the clickable cue. */
a.pp-dash-headline {
    color: var(--bs-body-color);
    text-decoration: none;
}
a.pp-dash-headline:hover { text-decoration: underline; }

.pp-dash-body { flex: 1 1 auto; min-height: 0; margin-top: .9rem; overflow: auto; }

/* Guarantees breathing room above the footer bar, whether it follows the header directly or the body */
.pp-dash-header:has(+ .pp-dash-footer),
.pp-dash-body:has(+ .pp-dash-footer) {
    margin-bottom: 1.1rem;
}

.pp-dash-footer {
    margin-top: auto;
    margin-left: calc(var(--oc-widget-body-padding, 17px) * -1);
    margin-right: calc(var(--oc-widget-body-padding, 17px) * -1);
    margin-bottom: -11px;
    padding: 10px var(--oc-widget-body-padding, 17px);
    background: var(--oc-sidebar-bg, var(--bs-tertiary-bg));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .3rem 1.25rem;
}
.pp-dash-footer a { display: inline-flex; align-items: center; gap: .35rem; }
.pp-dash-footer .pp-dash-icon { flex: 0 0 auto; width: 14px; height: 14px; opacity: .7; }

/* Solid colored badge matching October's own .indicator-icon, slightly downsized for a lighter look */
.pp-dash-badge {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: rgb(var(--pp-dash-accent-rgb, 99, 102, 241));
    color: #fff;
}
.pp-dash-badge img { width: 100%; height: 100%; object-fit: cover; }
.pp-dash-badge i { font-size: 28px; line-height: 1; color: inherit; }
.pp-dash-badge .pp-dash-icon { width: 22px; height: 22px; }
/* Account manager's photo, 1.5x the standard 36px badge for a real portrait rather than an
   icon-sized thumbnail. */
.pp-dash-badge--photo { width: 54px; height: 54px; border-radius: 9px; }
.pp-dash-header:has(.pp-dash-badge--photo) { align-items: center; }
.pp-dash-badge--contact { --pp-dash-accent-rgb: 99, 102, 241; }
.pp-dash-badge--support { --pp-dash-accent-rgb: 16, 185, 129; }
.pp-dash-badge--site { --pp-dash-accent-rgb: 14, 165, 233; }
.pp-dash-badge--breves { --pp-dash-accent-rgb: 245, 158, 11; }
.pp-dash-badge--iframe { --pp-dash-accent-rgb: 139, 92, 246; }
.pp-dash-badge--report { --pp-dash-accent-rgb: 244, 63, 94; }
.pp-dash-badge--launch { --pp-dash-accent-rgb: 20, 184, 166; }
.pp-dash-badge--online { --pp-dash-accent-rgb: 39, 174, 96; }
.pp-dash-badge--maintenance { --pp-dash-accent-rgb: 230, 126, 34; }

.pp-dash-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: .6rem;
    padding: 1.25rem .5rem;
    margin: auto 0;
}

.pp-dash-contact__list { list-style: none; margin: 0; padding: 0; }
.pp-dash-contact__list li { margin-bottom: .15rem; }

.pp-dash-subtext { font-size: 12px; opacity: .65; margin: 0 0 .35rem; }

.pp-dash-detail-lines { list-style: none; margin: 0; padding: 0; }
.pp-dash-detail-lines li { display: flex; align-items: center; gap: .4rem; margin-bottom: .2rem; }
.pp-dash-detail-lines .pp-dash-icon { flex: 0 0 auto; width: 14px; height: 14px; opacity: .6; }
/* A detail line can double as a mailto/tel link; keep the same look as plain text and only
   underline on hover as the clickable cue, so it doesn't compete with the footer link color. */
.pp-dash-detail-lines li a {
    display: flex;
    align-items: center;
    gap: .4rem;
    color: inherit;
    text-decoration: none;
}
.pp-dash-detail-lines li a:hover { text-decoration: underline; }

.pp-dash-feed { list-style: none; margin: 0; padding: 0; }
.pp-dash-feed li { padding: .5rem 0; border-bottom: 1px solid var(--bs-border-color); }
.pp-dash-feed li:first-child { padding-top: 0; }
.pp-dash-feed li:last-child { border-bottom: 0; }
.pp-dash-feed__title { font-weight: 600; }
.pp-dash-feed__date { opacity: .6; font-size: 12px; }
.pp-dash-feed__desc { margin: .2rem 0 0; opacity: .85; }
.pp-dash-feed__head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.pp-dash-feed__tag {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: .05rem .5rem;
    border-radius: 999px;
    background: var(--bs-secondary-bg);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .02em;
    opacity: .8;
}

.pp-dash-info { list-style: none; margin: 0; padding: 0; }
.pp-dash-info > li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: .5rem 0;
    border-bottom: 1px solid var(--bs-border-color);
}
.pp-dash-info > li:first-child { padding-top: 0; }
.pp-dash-info > li:last-child { border-bottom: 0; }
.pp-dash-info__label { opacity: .65; }
.pp-dash-info__value { text-align: right; font-weight: 600; }
.pp-dash-domains { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.pp-dash-domains li {
    padding: .3rem .6rem;
    border-radius: 999px;
    background: var(--bs-secondary-bg);
    font-weight: 500;
    font-size: 12px;
}
.pp-dash-domains__meta { opacity: .6; font-size: 12px; }

.pp-dash-bar__track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--bs-secondary-bg);
    overflow: hidden;
}
.pp-dash-bar__value {
    height: 100%;
    border-radius: 999px;
    transition: width .3s ease;
}
/* Breathing room when a line of text (e.g. the go-live date) follows the bar directly. */
.pp-dash-bar + .pp-dash-subtext { margin-top: .5rem; }

.pp-dash-iframe { width: 100%; height: 100%; min-height: 120px; border: 0; display: block; border-radius: 6px; }
</style>
